[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "traffic-prediction-core"
version = "0.1.0"
description = "Core data and machine learning package for Traffic Prediction Paris."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "traffic-prediction-shared>=0.1.0",
    "httpx>=0.28,<1.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18,<22",
    "duckdb>=1.2,<2.0",
    "scikit-learn>=1.6,<2.0",
    "holidays>=0.60,<1.0",
    "lightgbm>=4.6,<5.0",
    "mlflow>=3.0,<4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20.0",
]


[project.optional-dependencies]
dev = [
    "jupyterlab>=4.3,<5.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.10,<4.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_prediction*"]


[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"