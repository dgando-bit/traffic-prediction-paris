x-airflow-common: &airflow-common
    build:
        context: .
        dockerfile: services/airflow/Dockerfile
    
    environment: &airflow-common-env
        # ---------------- AIRFLOW ----------------
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
        
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        
        AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
        
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
        
        # ---------------- APPLICATION DATABASE ----------------
        TP_POSTGRES_USER: ${TP_POSTGRES_USER}
        TP_POSTGRES_PASSWORD: ${TP_POSTGRES_PASSWORD}
        TP_POSTGRES_HOST: postgres
        TP_POSTGRES_PORT: 5432
        TP_POSTGRES_DB: ${TP_POSTGRES_DB}
        
        # ---------------- MLFLOW ----------------
        # Native MLflow environment variable
        MLFLOW_TRACKING_URI: http://mlflow-srv:5000
        
        # Application configuration
        TP_MLFLOW_TRACKING_URI: http://mlflow-srv:5000
        TP_REGISTERED_MODEL_NAME: ${TP_REGISTERED_MODEL_NAME}
        TP_TRAINED_MODEL_ALIAS: ${TP_TRAINED_MODEL_ALIAS}
        TP_API_MODEL_ALIAS: ${TP_API_MODEL_ALIAS}
    
    volumes:
        - ./services/airflow/dags:/opt/airflow/dags
        - ./services/airflow/logs:/opt/airflow/logs
        - ./services/airflow/plugins:/opt/airflow/plugins
        - ./data:/opt/airflow/data


services:
    
    # ==========================================================
    # POSTGRES - APPLICATION + MLFLOW
    # ==========================================================
    postgres:
        image: postgres:17
        
        environment:
            POSTGRES_USER: ${TP_POSTGRES_USER}
            POSTGRES_PASSWORD: ${TP_POSTGRES_PASSWORD}
            POSTGRES_DB: ${TP_POSTGRES_DB}
        
        ports:
            - "${TP_POSTGRES_PORT}:5432"
        
        volumes:
            - postgres_data:/var/lib/postgresql/data
        
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "pg_isready -U ${TP_POSTGRES_USER} -d ${TP_POSTGRES_DB}"
              ]
            interval: 5s
            timeout: 5s
            retries: 5
    
    
    # ==========================================================
    # MLFLOW
    # ==========================================================
    mlflow-srv:
        build:
            context: .
            dockerfile: services/mlflow/Dockerfile
        
        command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME}
            - --artifacts-destination
            - /mlartifacts
        
        ports:
            - "${MLFLOW_PORT}:5000"
        
        volumes:
            - mlflow_artifacts:/mlartifacts
        
        depends_on:
            postgres:
                condition: service_healthy
    
    
    # ==========================================================
    # API
    # ==========================================================
    api:
        build:
            context: .
            dockerfile: services/api/Dockerfile
        
        environment:
            # Application database
            TP_POSTGRES_USER: ${TP_POSTGRES_USER}
            TP_POSTGRES_PASSWORD: ${TP_POSTGRES_PASSWORD}
            TP_POSTGRES_HOST: postgres
            TP_POSTGRES_PORT: 5432
            TP_POSTGRES_DB: ${TP_POSTGRES_DB}
            
            # MLflow
            MLFLOW_TRACKING_URI: http://mlflow-srv:5000
            TP_MLFLOW_TRACKING_URI: http://mlflow-srv:5000
            
            TP_REGISTERED_MODEL_NAME: ${TP_REGISTERED_MODEL_NAME}
            TP_API_MODEL_ALIAS: ${TP_API_MODEL_ALIAS}
        
        ports:
            - "8000:8000"
        
        depends_on:
            postgres:
                condition: service_healthy
            
            mlflow-srv:
                condition: service_started
    
    
    # ==========================================================
    # AIRFLOW POSTGRES
    # ==========================================================
    airflow-postgres:
        image: postgres:17
        
        environment:
            POSTGRES_USER: ${AIRFLOW_DB_USER}
            POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
            POSTGRES_DB: ${AIRFLOW_DB_NAME}
        
        volumes:
            - airflow_postgres_data:/var/lib/postgresql/data
        
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"
              ]
            interval: 5s
            timeout: 5s
            retries: 5
    
    
    # ==========================================================
    # AIRFLOW INIT
    # ==========================================================
    airflow-init:
        <<: *airflow-common
        
        environment:
            <<: *airflow-common-env
            
            AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
            AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
            AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
        
        depends_on:
            airflow-postgres:
                condition: service_healthy
        
        command:
            - bash
            - -c
            - |
                set -e
                
                airflow db migrate
                
                airflow users create \
                  --username "$AIRFLOW_ADMIN_USERNAME" \
                  --password "$AIRFLOW_ADMIN_PASSWORD" \
                  --firstname Admin \
                  --lastname User \
                  --role Admin \
                  --email "$AIRFLOW_ADMIN_EMAIL" \
                || echo "Airflow admin user already exists."
    
    
    # ==========================================================
    # AIRFLOW API SERVER
    # ==========================================================
    airflow-apiserver:
        <<: *airflow-common
        
        command: api-server
        
        ports:
            - "8080:8080"
        
        depends_on:
            airflow-postgres:
                condition: service_healthy
            
            postgres:
                condition: service_healthy
            
            mlflow-srv:
                condition: service_started
    
    
    # ==========================================================
    # AIRFLOW SCHEDULER
    # ==========================================================
    airflow-scheduler:
        <<: *airflow-common
        
        command: scheduler
        
        depends_on:
            airflow-postgres:
                condition: service_healthy
            
            postgres:
                condition: service_healthy
            
            mlflow-srv:
                condition: service_started
    
    
    # ==========================================================
    # AIRFLOW DAG PROCESSOR
    # ==========================================================
    airflow-dag-processor:
        <<: *airflow-common
        
        command: dag-processor
        
        depends_on:
            airflow-postgres:
                condition: service_healthy
            
            postgres:
                condition: service_healthy
            
            mlflow-srv:
                condition: service_started


    # ==========================================================
    # PROMETHEUS
    # ==========================================================
    prometheus:
        image: prom/prometheus:latest
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        ports:
            - "9090:9090"
        volumes:
          - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
          - ./deployments/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
          - prometheus_data:/prometheus
        depends_on:
            - api
        restart: unless-stopped

    grafana:
        image: grafana/grafana:latest
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
        volumes:
            - grafana_data:/var/lib/grafana
            - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - prometheus
        restart: unless-stopped

# ==============================================================
# VOLUMES
# ==============================================================
volumes:
    postgres_data:
    airflow_postgres_data:
    mlflow_artifacts:
    prometheus_data:
    grafana_data: