services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: traffic
            POSTGRES_PASSWORD: traffic
            POSTGRES_DB: traffic_prediction
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "pg_isready -U traffic -d traffic_prediction"
              ]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data: