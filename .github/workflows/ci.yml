name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install shared package
        run: |
          python -m pip install -e ./packages/shared

      - name: Install traffic prediction package
        run: |
          python -m pip install -e ./packages/traffic_prediction

      - name: Install CI tools
        run: |
          python -m pip install ruff pytest

      - name: Run Ruff
        run: |
          ruff check \
            packages/shared/shared \
            packages/traffic_prediction/traffic_prediction \
            services/api/src/api_service \
            services/airflow/dags \
            scripts

      - name: Compile Python sources
        run: |
          python -m compileall \
            packages/shared/shared \
            packages/traffic_prediction/traffic_prediction \
            services/api/src/api_service \
            services/airflow/dags \
            scripts

      - name: Run tests when available
        shell: bash
        run: |
          if find tests -type f -name "test_*.py" | grep -q .; then
            python -m pytest tests -v
          else
            echo "No tests found yet — skipping pytest."
          fi